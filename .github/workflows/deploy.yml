name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel superseded runs on the same branch so only the newest commit is checked.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Deployment is done via SSH to the STRATO V-Server — see DEPLOYMENT.md.
# This workflow only proves the branch is releasable: if it is green, the same
# commands will succeed on the server.
jobs:
  verify:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          # The build reads this to bake absolute URLs into the sitemap and the
          # link-preview tags. CI only needs it to be a valid URL — the value
          # that matters is the one used for the real build on the server.
          NEXT_PUBLIC_SITE_URL: https://www.flinkfreight.de

      - name: Summary
        if: always()
        run: |
          {
            echo "### ${{ job.status == 'success' && 'Ready to deploy' || 'Not deployable' }}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **Branch** | \`${{ github.ref_name }}\` |"
            echo "| **Commit** | \`${{ github.sha }}\` |"
            echo "| **Result** | ${{ job.status }} |"
            echo ""
            echo "Deploy: SSH into the STRATO V-Server, pull, rebuild, and restart PM2."
            echo "See DEPLOYMENT.md Part 8 (Redeploying)."
          } >> "$GITHUB_STEP_SUMMARY"
